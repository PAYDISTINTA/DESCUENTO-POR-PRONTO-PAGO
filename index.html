<head>
    <meta charset="UTF-8">

    <title>Descuento por Pronto Pago - Control Interno</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #2c3e50; border-bottom: 2px solid #34495e; padding-bottom: 10px; margin-top: 0; }
        .grid-manual { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; background-color: #fff5f5; padding: 20px; border: 1px solid #ffcccc; border-radius: 6px; margin-bottom: 25px; }
        .grid-automatico { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; background-color: #f0f9f4; padding: 20px; border: 1px solid #c2e0c6; border-radius: 6px; margin-bottom: 25px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; color: #34495e; font-size: 14px; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        .manual-input { color: #d9534f; font-weight: bold; border-color: #f5c6cb; }
        .auto-input { background-color: #eaedd5; color: #27ae60; font-weight: bold; border-color: #c3e6cb; }
        .seccion-titulo { grid-column: span 2; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; margin: 0; }
        .titulo-rojo { color: #c0392b; }
        .titulo-verde { color: #27ae60; }
        .btn-whatsapp { display: block; width: 100%; background-color: #25D366; color: white; border: none; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer; text-align: center; text-decoration: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-whatsapp:hover { background-color: #128C7E; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔎 PANEL DE CONTROL - DESCUENTO POR PRONTO PAGO</h2>
    <p><i>Uso interno exclusivo para personal autorizado.</i></p>

    <!-- Campos que se llenan a mano (Letras Rojas) -->
    <div class="grid-manual">
        <h3 class="seccion-titulo titulo-rojo">✍️ Introducción Manual (Datos del Crédito)</h3>
        <div class="form-group">
            <label>Nombre del Cliente:</label>
            <input type="text" class="manual-input" id="cliente" value="PATRICIA FERNANDEZ CASIMIRO">
        </div>
        <div class="form-group">
            <label>Fecha de Venta:</label>
            <input type="date" class="manual-input" id="fechaVenta" value="2025-11-03">
        </div>
        <div class="form-group">
            <label>Semanas Pactadas:</label>
            <input type="number" class="manual-input" id="semanasPactadas" value="52">
        </div>
        <div class="form-group">
            <label>Pago Semanal ($):</label>
            <input type="number" class="manual-input" id="pagoSemanal" value="265">
        </div>
        <div class="form-group">
            <label>Precio de Contado ($):</label>
            <input type="number" class="manual-input" id="precioContado" value="8960">
        </div>
        <div class="form-group">
            <label>Total Pagado a la Fecha ($):</label>
            <input type="number" class="manual-input" id="pagadoAcumulado" value="12065">
        </div>
    </div>

    <!-- Campos Calculados Automáticamente (Letras Verdes/Negras) -->
    <div class="grid-automatico">
        <h3 class="seccion-titulo titulo-verde">🤖 Cálculos Automáticos del Sistema</h3>
        <div class="form-group">
            <label>Semanas Transcurridas (Sáb-Jue):</label>
            <input type="text" class="auto-input" id="calcSemanas" value="42" readonly>
        </div>
        <div class="form-group">
            <label>Saldo Regular Restante ($):</label>
            <input type="text" class="auto-input" id="calcSaldoRegular" value="1,715.00" readonly>
        </div>
        <div class="form-group">
            <label>Ahorro / Descuento Hoy ($):</label>
            <input type="text" class="auto-input" id="calcDescuento" value="926.92" readonly>
        </div>
        <div class="form-group">
            <label>MONTO NETO A PAGAR HOY ($):</label>
            <input type="text" class="auto-input" id="calcNeto" value="788.08" style="font-size: 20px; border: 2px solid #27ae60;" readonly>
        </div>
    </div>

    <!-- Botón de Envío -->
        <!-- Botón de Envío Corregido -->
    <button class="btn-whatsapp" onclick="enviarWhatsApp()">
        💬 Enviar Liquidación por WhatsApp
    </button>
</div>
