<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Pronto Pago - DISTINTA.COM</title>
    <!-- Bootstrap 5 para garantizar una interfaz moderna y adaptativa en celulares y computadoras -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: Arial, sans-serif; }
        .card-calculadora { border-radius: 12px; border: none; }
        .header-app { background-color: #0056b3; color: white; border-radius: 12px 12px 0 0; }
        .caja-resultado { background-color: #e8f4ea; border: 1px solid #c3e6cb; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow card-calculadora">
                
                <!-- Encabezado de la Aplicación -->
                <div class="card-header header-app text-center py-3">
                    <h3 class="fw-bold mb-0">DISTINTA.COM</h3>
                    <small class="text-white-50">Herramienta Interna: Descuento por Pronto Pago</small>
                </div>

                <div class="card-body p-4">
                    <form id="formProntoPago" onsubmit="event.preventDefault();">
                        
                        <!-- Folio y Nombre del Cliente -->
                        <div class="row g-2 mb-3">
                            <div class="col-4">
                                <label class="form-label small fw-bold">Folio / N°</label>
                                <input type="text" id="inputFolio" class="form-control" placeholder="Ej: 123-D" oninput="calcularDescuento()">
                            </div>
                            <div class="col-8">
                                <label class="form-label small fw-bold">Nombre del Cliente</label>
                                <input type="text" id="inputNombre" class="form-control" placeholder="Nombre completo" oninput="calcularDescuento()">
                            </div>
                        </div>

                        <!-- Importe Base -->
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Importe Original ($)</label>
                            <input type="number" id="inputMontoOriginal" class="form-control form-control-lg fw-bold text-primary" placeholder="0.00" oninput="calcularDescuento()">
                        </div>

                        <!-- Tipo de Descuento y Valor -->
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-bold">Tipo de Descuento</label>
                                <select id="selectTipoDescuento" class="form-select" onchange="calcularDescuento()">
                                    <option value="porcentaje" selected>Porcentaje (%)</option>
                                    <option value="monto">Monto Fijo ($)</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-bold">Valor del Descuento</label>
                                <input type="number" id="inputValorDescuento" class="form-control" placeholder="Ej: 10" oninput="calcularDescuento()">
                            </div>
                        </div>

                        <!-- Fecha Límite de Pronto Pago -->
                        <div class="mb-4">
                            <label class="form-label small fw-bold">Fecha Límite de Aplicación</label>
                            <input type="date" id="inputFechaLimite" class="form-control" onchange="calcularDescuento()">
                        </div>

                        <!-- Desglose de Resultados Financieros -->
                        <div class="caja-resultado p-3 mb-4">
                            <div class="row text-center">
                                <div class="col-6 border-end">
                                    <small class="text-muted fw-bold d-block">AHORRO DEL CLIENTE</small>
                                    <span class="fs-4 fw-bold text-success" id="lblAhorro">$0.00</span>
                                </div>
                                <div class="col-6">
                                    <small class="text-muted fw-bold d-block">PAGO CON DESCUENTO</small>
                                    <span class="fs-4 fw-bold text-primary" id="lblTotalConDescuento">$0.00</span>
                                </div>
                            </div>
                        </div>

                        <!-- Botón para Enviar Cotización por WhatsApp -->
                        <button type="button" class="btn btn-success w-100 fw-bold py-2 shadow-sm" onclick="enviarPropuestaWhatsApp()">
                            💬 Enviar Propuesta por WhatsApp
                        </button>

                    </form>
                </div>

            </div>
        </div>
    </div>
</div>

<script>
    // DOCUMENTACIÓN EDUCACIONAL: Función para formatear números en formato de moneda mexicana (MXN)
    function formatearMoneda(cantidad) {
        return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(cantidad);
    }

    // DOCUMENTACIÓN EDUCACIONAL: Función principal de cálculo dinámico
    function calcularDescuento() {
        // Explicación de Variables:
        // Obtención de los valores del DOM convertidos a números flotantes
        const montoOriginal = parseFloat(document.getElementById("inputMontoOriginal").value) || 0;
        const tipoDescuento = document.getElementById("selectTipoDescuento").value;
        const valorDescuento = parseFloat(document.getElementById("inputValorDescuento").value) || 0;

        let ahorro = 0;
        let totalFinal = montoOriginal;

        // Lógica de Negocio: Evalúa el tipo de descuento seleccionado
        if (tipoDescuento === "porcentaje") {
            ahorro = montoOriginal * (valorDescuento / 100);
        } else if (tipoDescuento === "monto") {
            ahorro = valorDescuento;
        }

        // Validación para evitar que el ahorro supere el monto original
        if (ahorro > montoOriginal) ahorro = montoOriginal;

        totalFinal = montoOriginal - ahorro;

        // Actualización de los elementos de texto en la pantalla (DOM)
        document.getElementById("lblAhorro").innerText = formatearMoneda(ahorro);
        document.getElementById("lblTotalConDescuento").innerText = formatearMoneda(totalFinal);

        return { montoOriginal, ahorro, totalFinal };
    }

    // DOCUMENTACIÓN EDUCACIONAL: Función de integración con la API de WhatsApp
    function enviarPropuestaWhatsApp() {
        const folio = document.getElementById("inputFolio").value || "N/A";
        const nombre = document.getElementById("inputNombre").value || "Cliente";
        const fechaLimite = document.getElementById("inputFechaLimite").value;
        
        // Ejecuta el cálculo para obtener las cifras actualizadas
        const { montoOriginal, ahorro, totalFinal } = calcularDescuento();

        if (montoOriginal <= 0) {
            alert("Por favor ingresa un importe original válido.");
            return;
        }

        // Formateo de fecha para mostrar día/mes/año al cliente
        let fechaTexto = "próximamente";
        if (fechaLimite) {
            const partes = fechaLimite.split("-");
            fechaTexto = `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        // Construcción de la plantilla de mensaje corporativo
        const mensaje = `Hola *${nombre}*, te saludamos de *DISTINTA.COM*.\n\n` +
                        `Tenemos una excelente noticia respecto a tu crédito *N° ${folio}*:\n\n` +
                        `🔹 *Importe regular:* ${formatearMoneda(montoOriginal)}\n` +
                        `🎉 *Ahorro por pronto pago:* ${formatearMoneda(ahorro)}\n` +
                        `✅ *Total a pagar con beneficio:* ${formatearMoneda(totalFinal)}\n\n` +
                        `📅 *Vigencia:* Realizando tu pago a más tardar el *${fechaTexto}*.\n\n` +
                        `¿Te gustaría aprovechar esta promoción? Quedamos a tus órdenes.`;

        // Apertura de la API de WhatsApp
        const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensaje)}`;
        window.open(url, '_blank');
    }
</script>

</body>
</html>
